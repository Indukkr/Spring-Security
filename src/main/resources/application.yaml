server:
  port: 8081

spring:
  application:
    name: Spring-Security

  datasource:
    url: jdbc:mysql://localhost:3306/security_db
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    user:
      name: indu
      password: pass
      roles[]: {"USER","ADMIN"}
jwt:
  secretkey: ThisIsSecretKeyFortheJWTTokenInSecurityIamLearing

logging:
  level:
    org:
      springframework:
        security: TRACE
